name: Weekly Oil Report

on:
  schedule:
    # Sunday 04:00 UTC = 09:30 IST. Sends one weekly report instead of daily automation.
    - cron: '0 4 * * 0'
  workflow_dispatch:

jobs:
  weekly-report:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run weekly oil report pipeline
        run: python main.py weekly

      - name: Generate weekly performance report
        run: python main.py performance

      - name: Upload weekly artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: weekly-oil-report-artifacts
          path: |
            oil_signal.log
            oil_predictions.csv
